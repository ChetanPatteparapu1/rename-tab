<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --key-bg: #f3f4f6;
        --key-text: #1f2937;
        --accent: #4f46e5;
        --accent-text: #ffffff;
        --hover: #f9fafb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1f2430;
          --text: #f3f5f9;
          --muted: #9aa3b2;
          --border: #343b4a;
          --key-bg: #2b3140;
          --key-text: #e8ebf2;
          --accent: #818cf8;
          --accent-text: #14161d;
          --hover: #272d3a;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 272px;
        margin: 0;
        padding: 14px 14px 12px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        padding: 8px 9px;
        margin-bottom: 6px;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 9px;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .row:hover { background: var(--hover); }
      .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      kbd {
        flex: none;
        padding: 3px 7px;
        background: var(--key-bg);
        color: var(--key-text);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-family: inherit;
        font-size: 11.5px;
        font-weight: 600;
        white-space: nowrap;
      }
      kbd.unset { color: var(--muted); font-weight: 500; }
      .persist {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
      }
      .persist .note { display: block; margin-bottom: 8px; }
      button.wide {
        width: 100%;
        padding: 8px 10px;
        background: var(--accent);
        color: var(--accent-text);
        border: none;
        border-radius: 8px;
        font: inherit;
        font-weight: 600;
        font-size: 12.5px;
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      button.wide.off {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }
      .foot {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .note { color: var(--muted); font-size: 11px; line-height: 1.4; }
      .links { flex: none; display: flex; gap: 10px; }
      .link {
        flex: none;
        background: none;
        border: none;
        padding: 0;
        color: var(--accent);
        font: inherit;
        font-size: 11.5px;
        cursor: pointer;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>Rename Tab</h1>

    <button class="row" id="rename">
      <span>Rename this tab</span>
      <kbd id="rename-key">…</kbd>
    </button>

    <button class="row" id="restore">
      <span>Restore original title</span>
      <kbd id="restore-key">…</kbd>
    </button>

    <div class="persist" id="persist" hidden>
      <span class="note" id="persist-label"></span>
      <button class="wide" id="persist-button"></button>
    </div>

    <div class="foot">
      <span class="note" id="note">The title resets when the page reloads.</span>
      <span class="links">
        <button class="link" id="shortcuts">Shortcuts</button>
        <button class="link" id="settings">About</button>
      </span>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
